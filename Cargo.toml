[package]
name = "emvault-dev-signer"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gmikeska/emvault-dev-signer"
description = "Dev/CI HsmBackend implementation that pairs with libemvault_dev_hsm.so."

[lib]
name = "emvault_dev_signer"
path = "src/lib.rs"

[dependencies]
emvault-pkcs11 = { version = "0.3.0", path = "../emvault-pkcs11" }
emvault-core = { version = "0.3.0", path = "../emvault-core" }
bitcoin = "0.32.10"
cryptoki = "0.12"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dotenvy = "0.15"
log = "0.4"

[dev-dependencies]
env_logger = "0.11"
cryptoki-sys = "0.5"
libloading = "0.8"

[[example]]
name = "setup_dev_federation"
path = "examples/setup_dev_federation.rs"
