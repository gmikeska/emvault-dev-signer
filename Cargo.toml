[package]
name = "asterism-dev-signer"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Dev/CI HsmBackend implementation that pairs with libasterism_dev_hsm.so."

[lib]
name = "asterism_dev_signer"
path = "src/lib.rs"

[dependencies]
asterism-pkcs11 = { path = "../asterism-pkcs11" }
asterism-core = { path = "../asterism-core" }
bitcoin = "0.32.10"
bip39 = "2.1"
cryptoki = "0.12"
hex = "0.4"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dotenvy = "0.15"
log = "0.4"

[dev-dependencies]
env_logger = "0.11"
cryptoki-sys = "0.5"
libloading = "0.8"

[[example]]
name = "setup_dev_federation"
path = "examples/setup_dev_federation.rs"
